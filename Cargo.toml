[package]
name = "mtprsto"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mtprsto"
path = "src/main.rs"

[dependencies]
aes = "0.9"
base64 = "0.23.1"
cipher = "0.5"
flate2 = "1"
md-5 = "0.11"
num-bigint = { version = "0.5", features = ["rand_0_10"] }
num-traits = "0.2"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
