[package]
name = "mtprsto"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mtprsto"
path = "src/main.rs"

[dependencies]
aes = "0.8"
bytes = "1"
cipher = "0.4"
flate2 = "1"
hmac = "0.12"
md-5 = "0.10"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
